name: Options-Screener

on:
  schedule:
    # Zeiten in UTC. GitHub startet geplante Läufe oft verspätet und lässt manche ganz aus (am 23.09.2026 kam der
    # 11:41-Lauf erst um 15:33). Deshalb gibt es je Lauf mehrere Termine; wer die Arbeit schon erledigt findet,
    # überspringt sie in unter einer Minute.
    # Abend: nach US-Handelsschluss. 21:37, 23:17 und 01:47 UTC liegen im Sommer wie im Winter am selben Tag New York.
    - cron: "37 21 * * 1-5"
    - cron: "17 23 * * 1-5"
    - cron: "47 1 * * 2-6"
    # Morgen: Open Interest nach dem Handelstag, danach Analyse und Auswertung. Weitere Termine holen nur nach,
    # was noch fehlt (altes OI, fehlgeschlagene Ticker, fehlende Analyse).
    - cron: "41 11 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "33 15 * * 1-5"
    - cron: "13 17 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = Live-Test mit 3 Tickern, schreibt nichts"
        type: choice
        options: [smoke, evening, morning, analyze, evaluate]
        default: smoke
      session:
        description: "Handelstag YYYY-MM-DD (nur analyze)"
        required: false
      extra:
        description: "zusätzliche Argumente, z. B. --allow-past oder --force"
        required: false

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Branch statt Commit: ein wartender Lauf startet so auf dem Stand, den der vorige Lauf gepusht hat.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="$INPUT_MODE";
          else
            case "$SCHEDULE" in
              "37 21 * * 1-5"|"17 23 * * 1-5"|"47 1 * * 2-6") MODE="evening" ;;
              *) MODE="morning" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modus: $MODE"

      - name: Tests
        if: steps.mode.outputs.mode == 'smoke'
        run: python -m pytest -q

      - name: Lauf
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SESSION: ${{ inputs.session }}
          EXTRA: ${{ inputs.extra }}
        run: |
          ARGS=("$MODE")
          if [ -n "$SESSION" ]; then ARGS+=(--session "$SESSION"); fi
          python -m screener.run "${ARGS[@]}" $EXTRA

      # Auch nach einem Fehler in Analyse oder Auswertung: bereits geholte Rohdaten gehen nicht verloren,
      # und der nächste Termin holt die fehlende Analyse nach.
      - name: Daten committen
        if: ${{ !cancelled() && steps.mode.outputs.mode != 'smoke' }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Daten: $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep 10
          done
          exit 1
